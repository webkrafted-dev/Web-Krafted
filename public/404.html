<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0B1F3B" />
    <title>Page not found — WK Studios</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0B1F3B; color: #F7F8FA; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
      main { width: min(100%, 780px); }
      img { display: block; width: 133px; height: 56px; object-fit: contain; }
      p { color: #DDE4EC; line-height: 1.7; max-width: 600px; }
      .eyebrow { margin-top: 52px; color: #B8FF3B; text-transform: uppercase; letter-spacing: .24em; font-size: 12px; font-weight: 700; }
      h1 { margin: 12px 0; font-size: clamp(34px, 7vw, 58px); line-height: 1.08; letter-spacing: -.04em; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 18px; border-radius: 8px; font-weight: 700; color: #0B1F3B; background: #B8FF3B; text-decoration: none; }
      a.secondary { color: #F7F8FA; border: 1px solid #ffffff44; background: transparent; }
      a:focus-visible { outline: 3px solid #B8FF3B; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="WK Studios home"><img src="/wk-mark-on-dark.png" width="266" height="112" alt="WK Studios" /></a>
      <p class="eyebrow">404 · Page not found</p>
      <h1>This page left the layout.</h1>
      <p>The address you followed does not exist here. It may have moved, or the link may contain a typo.</p>
      <nav aria-label="Helpful links">
        <a href="/">Back to home</a>
        <a class="secondary" href="/work">Explore concept work</a>
        <a class="secondary" href="/contact">Start a project</a>
      </nav>
    </main>
  </body>
</html>
